name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm zstd libarchive-tools
      - name: Run the test suite
        run: REQUIRE_PACKAGE_TOOLS=1 make test
      - name: Build packages
        run: VER="${GITHUB_REF_NAME#v}" packaging/build.sh
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*