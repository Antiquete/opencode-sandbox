name: AUR

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set PKGBUILD version
        run: |
          VER="$(git describe --always --tags --dirty | sed 's/^v//; s/-/./g')"
          sed -i "s/^pkgver=.*/pkgver=$VER/" packaging/aur-git/PKGBUILD
      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: opencode-sandbox-git
          pkgbuild: packaging/aur-git/PKGBUILD
          commit_username: ${{ secrets.AUR_COMMIT_USERNAME }}
          commit_email: ${{ secrets.AUR_COMMIT_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update AUR package
          ssh_keyscan_types: rsa,ecdsa,ed25519