name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Syntax check
        run: bash -n opencode-sandbox opencode-project-init packaging/build.sh
      - name: Shellcheck
        run: shellcheck -S warning opencode-sandbox opencode-project-init packaging/build.sh